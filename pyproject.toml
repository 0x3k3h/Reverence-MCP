[project]
name = "reverence-mcp"
version = "0.1.0"
description = "Reverence — an MCP server for static reverse engineering of binaries, executables, DLLs, and web apps."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "0x3k3h" }]
keywords = ["mcp", "reverse-engineering", "binary-analysis", "pe", "elf", "disassembly", "security"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
]

dependencies = [
    "mcp>=1.2.0,<2",
    "pefile>=2024.8.26",
    "lief>=0.14.0",
    "capstone>=5.0.1",
    "jsbeautifier>=1.15.1",
]

[project.optional-dependencies]
# Extra engines that need an external binary or heavier wheels.
# radare2 (the `r2` binary) must be installed separately for the radare tools.
extras = [
    "r2pipe>=1.9.0",
    "yara-python>=4.5.0",
]

[project.urls]
Homepage = "https://github.com/0x3k3h/reverence-mcp"
Repository = "https://github.com/0x3k3h/reverence-mcp"
Issues = "https://github.com/0x3k3h/reverence-mcp/issues"

[project.scripts]
reverence-mcp = "reverence_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reverence_mcp"]
